version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ['type:deps']
    commit-message:
      prefix: chore
      include: scope
    groups:
      three:
        patterns: ['three', '@react-three/*', '@types/three']
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ['type:deps', 'area:ci']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
