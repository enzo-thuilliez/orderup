# Labels as code, synced by .github/workflows/labels.yml. Labels not listed here are deleted.
# New issues: one type:*, one or more area:*, one priority:*; agent:* says where it can be built.
# bug, enhancement and docs are kept for older issues; use type:* on new ones.
- name: 'accessibility'
  color: 'f143ab'
  description: 'Barrier affecting people with disabilities'
- name: 'agent:cloud'
  color: 'bfdadc'
  description: 'Self-contained, fits a cloud session'
- name: 'agent:local'
  color: 'd93f0b'
  description: 'Needs a local Claude Code agent (real claude CLI / browser)'
- name: 'area:ci'
  color: '0e8a16'
  description: 'GitHub Actions, Dependabot, hooks'
- name: 'area:cli'
  color: 'fbca04'
  description: ''
- name: 'area:docs'
  color: '0e8a16'
  description: 'README, AGENTS, DECISIONS, ROADMAP'
- name: 'area:server'
  color: '1d76db'
  description: ''
- name: 'area:shared'
  color: 'c5def5'
  description: ''
- name: 'area:web'
  color: '0e8a16'
  description: ''
- name: 'bug'
  color: 'd73a4a'
  description: "Something isn't working"
- name: 'docs'
  color: '0075ca'
  description: ''
- name: 'documentation'
  color: '0075ca'
  description: 'Improvements or additions to documentation'
- name: 'duplicate'
  color: 'cfd3d7'
  description: 'This issue or pull request already exists'
- name: 'enhancement'
  color: 'a2eeef'
  description: 'New feature or request'
- name: 'good first issue'
  color: '7057ff'
  description: 'Good for newcomers'
- name: 'help wanted'
  color: '008672'
  description: 'Extra attention is needed'
- name: 'invalid'
  color: 'e4e669'
  description: "This doesn't seem right"
- name: 'later'
  color: 'c5def5'
  description: 'Planned after V1'
- name: 'priority:p0'
  color: 'b60205'
  description: 'Blocks the current milestone'
- name: 'priority:p1'
  color: 'd93f0b'
  description: 'Needed for the milestone'
- name: 'priority:p2'
  color: 'fbca04'
  description: 'Nice to have, can slip'
- name: 'question'
  color: 'd876e3'
  description: 'Further information is requested'
- name: 'type:chore'
  color: '1d76db'
  description: 'Maintenance with no behaviour change'
- name: 'type:ci'
  color: '1d76db'
  description: 'CI workflows and repo automation'
- name: 'type:deps'
  color: '1d76db'
  description: 'Dependency updates'
- name: 'type:docs'
  color: '1d76db'
  description: 'Documentation only'
- name: 'type:feat'
  color: '1d76db'
  description: 'New capability'
- name: 'type:fix'
  color: '1d76db'
  description: 'Behaviour differs from the contract or docs'
- name: 'type:perf'
  color: '1d76db'
  description: 'Faster or lighter, same behaviour'
- name: 'type:refactor'
  color: '1d76db'
  description: 'Restructure without behaviour change'
- name: 'type:test'
  color: '1d76db'
  description: 'Tests only'
- name: 'v1'
  color: '5319e7'
  description: 'V1: the crew you can talk to'
- name: 'wontfix'
  color: 'ffffff'
  description: 'This will not be worked on'
