name: Bug report
description: Something in the kitchen is burning
title: 'fix(scope): '
labels: ['type:fix']
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: '1. '
    validations:
      required: true
  - type: input
    id: orderup
    attributes:
      label: OrderUp version
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (`claude --version`)
  - type: input
    id: node
    attributes:
      label: Node version (`node -v`)
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, WSL]
  - type: dropdown
    id: hooks
    attributes:
      label: Hooks installed?
      options: ['yes', 'no']
  - type: markdown
    attributes:
      value: Please redact file paths or commands you don't want to share.
