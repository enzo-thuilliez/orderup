name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA, with its tag in a comment; Dependabot bumps both.

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the engines floor (ADR-008); 24 is the dev version (.nvmrc).
        node: ['22.13.0', '24']
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: mkdir -p "$RUNNER_TEMP/pack" && npm pack -w orderup-cli --pack-destination "$RUNNER_TEMP/pack"
      - name: Smoke-test the packed orderup-cli
        run: node scripts/smoke-pack.mjs "$RUNNER_TEMP"/pack/orderup-cli-*.tgz
      - if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orderup-cli-tarball
          path: ${{ runner.temp }}/pack/orderup-cli-*.tgz
          if-no-files-found: error
          retention-days: 7

  # The tarball from Linux, installed and run on the other platforms users have.
  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['22.13.0', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orderup-cli-tarball
          path: pack
      - run: node scripts/smoke-pack.mjs pack/orderup-cli-*.tgz

  # The one check branch protection requires: green only if every job above is.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
