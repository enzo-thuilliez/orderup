# Publishes orderup-cli to npm with trusted publishing (OIDC, no token) and provenance.
# One-time npm setup and the release steps: docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check and `npm publish --dry-run`, without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish orderup-cli
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted publisher settings. Add required
    # reviewers to it in GitHub to approve each publish by hand.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # v6.1+ no longer writes the always-auth setting npm 11 warns about; v7 also drops the
      # dummy NODE_AUTH_TOKEN it exported, which trusted publishing (OIDC) does not need.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - name: Check what is being released
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          echo "orderup-cli $version from $GITHUB_REF (dry run: $DRY_RUN)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match packages/cli version $version"
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::publish from main or a v* tag only"
            exit 1
          fi
          if [ -n "$(npm view "orderup-cli@$version" version 2>/dev/null)" ]; then
            echo "::error::orderup-cli@$version is already on npm. Bump it with npx changeset version."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: mkdir -p "$RUNNER_TEMP/pack" && npm pack -w orderup-cli --pack-destination "$RUNNER_TEMP/pack"
      - name: Smoke-test the packed orderup-cli
        run: node scripts/smoke-pack.mjs "$RUNNER_TEMP"/pack/orderup-cli-*.tgz

      # npm silently rewrites a manifest it considers wrong (and says "invalid and removed" even
      # when it only normalized a path). Publish exactly what is committed, or nothing.
      - name: Check that npm publishes package.json as committed
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/publish-dry-run.log"
          npm publish -w orderup-cli --dry-run 2>&1 | tee "$log"
          if grep -iE 'auto-corrected|errors corrected|invalid and removed|removed invalid|was renamed to' "$log"; then
            echo "::error::npm would auto-correct packages/cli/package.json. Run npm pkg fix -w orderup-cli and commit the result."
            exit 1
          fi

      - name: Publish
        run: |
          flags=(--provenance --access public)
          if [ "$DRY_RUN" = true ]; then flags+=(--dry-run); fi
          npm publish -w orderup-cli "${flags[@]}"
